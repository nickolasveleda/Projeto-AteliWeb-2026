<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo.css">
  <title>AteliWeb - E-Commerce Cerâmica Artesanal</title>
</head>
<body>
  <header>
    <h1>
		<a href="inicio.html">
			<img src="logo.png" alt="logotipo">
		</a>
    </h1>
    <nav>
      <a href="navegar.html">Navegar</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
    <button id="toggle-cart-btn" onclick="toggleCart()">🛒</button>
  </header>

  <section class="hero">
    <div>
      <h1>Cerâmica Artesanal Única</h1>
      <p>Peças feitas a mão com amor e tradição</p>
    </div>
  </section>

  <section class="section">
    <h2>Destaques</h2>
    <div class="produtos">
      
      <div class="produto">
        <img src="vaso_rustico.jpg" alt="Vaso">
        <h3>Vaso rústico</h3>
        <p>R$ 89,90</p>
        <button class="btn" onclick="addToCart(1, 'Vaso rústico', 89.90, 'vaso_rustico.jpg')">Comprar</button>
      </div>

      <div class="produto">
        <img src="caneca_artesanal.jpg" alt="Caneca">
        <h3>Caneca artesanal</h3>
        <p>R$ 49,90</p>
        <button class="btn" onclick="addToCart(2, 'Caneca artesanal', 49.90, 'caneca_artesanal.jpg')">Comprar</button>
      </div>

      <div class="produto">
        <img src="prato_decorativo.jpg" alt="Prato">
        <h3>Prato decorativo</h3>
        <p>R$ 69,90</p>
        <button class="btn" onclick="addToCart(3, 'Prato decorativo', 69.90, 'prato_decorativo.jpg')">Comprar</button>
      </div>

    </div>
  </section>

  <div id="cart" class="cart">
    <h2>Carrinho</h2>
    <ul id="cart-items"></ul>
    <p id="total">Total: R$ 0,00</p>
	  <button id="checkout-btn" class="btn" onclick="goToCheckout()">Finalizar compra</button>
    <button class="btn" onclick="clearCart()">Limpar carrinho</button>
  </div>

  <div id="overlay" class="overlay" onclick="toggleCart()"></div>

  <script src="carrinho.js"></script>

  <div class="copyright">
    © 2026 AteliWeb - Todos os direitos reservados
  </div>
</body>
</html>
