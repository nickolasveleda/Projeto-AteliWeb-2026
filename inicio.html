<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>AteliWeb - E-Commerce Cerâmica Artesanal</title>
</head>
<body>
  <header>
    <h1>
		<a href="inicio.html">
			<img src="logo.png" alt="logotipo">
		</a>
    </h1>
    <nav>
      <a href="navegar.html">Navegar</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
    <button id="toggle-cart-btn" onclick="toggleCart()">🛒</button>
  </header>

  <section class="hero">
    <div>
      <h1>Cerâmica Artesanal Única</h1>
      <p>Peças feitas a mão com amor e tradição</p>
    </div>
  </section>

  <section class="section">
    <h2>Destaques</h2>
    <div class="produtos">
      
      <div class="produto">
        <img src="vaso_rustico.jpg" alt="Vaso">
        <h3>Vaso rústico</h3>
        <p>R$ 89,90</p>
        <button class="btn" onclick="addToCart('Vaso rústico', 89.90, 'vaso_rustico.jpg')">Comprar</button>
      </div>

      <div class="produto">
        <img src="caneca_artesanal.jpg" alt="Caneca">
        <h3>Caneca artesanal</h3>
        <p>R$ 49,90</p>
        <button class="btn" onclick="addToCart('Caneca artesanal', 49.90, 'caneca_artesanal.jpg')">Comprar</button>
      </div>

      <div class="produto">
        <img src="prato_decorativo.jpg" alt="Prato">
        <h3>Prato decorativo</h3>
        <p>R$ 69,90</p>
        <button class="btn" onclick="addToCart('Prato decorativo', 69.90, 'prato_decorativo.jpg')">Comprar</button>
      </div>

    </div>
  </section>

  <div id="cart" class="cart">
    <h2>Carrinho</h2>
    <ul id="cart-items"></ul>
    <p id="total">Total: R$ 0,00</p>
	  <button id="checkout-btn" class="btn" onclick="goToCheckout()">Finalizar compra</button>
    <button class="btn" onclick="clearCart()">Limpar carrinho</button>
  </div>

  <div id="overlay" class="overlay" onclick="toggleCart()"></div>

  <script>
	  let cart = JSON.parse(localStorage.getItem("cart")) || [];

	  function toggleCart() {
		  const cartEl = document.getElementById("cart");
		  const overlay = document.getElementById("overlay");

		  cartEl.classList.toggle("toggle");
		  overlay.classList.toggle("active");
	  }

	  function saveCart() {
		  localStorage.setItem("cart", JSON.stringify(cart));
	  }

	  function formatPrice(price) {
		  return price.toFixed(2).replace(".", ",");
	  }

	  function addToCart(name, price, image) {
		  const existing = cart.find(item => item.name === name);

		  if (existing) {
			 existing.quantity++;
		  } else {
			 cart.push({ name, price, image, quantity: 1 });
		  }

		  saveCart();
		  renderCart();
		  toggleCart(); // Abre o carrinho automaticamente quando adicionar um item a ele
	  }

	  function increaseQty(index) {
		  cart[index].quantity++;
		  saveCart();
		  renderCart();
	  }

	  function decreaseQty(index) {
		  if (cart[index].quantity > 1) {
			 cart[index].quantity--;
		  } else {
			 cart.splice(index, 1);
		  }
		  saveCart();
		  renderCart();
	  }

	  function removeItem(index) {
		  cart.splice(index, 1);
		  saveCart();
		  renderCart();
	  }

	  function clearCart() {
		  cart = [];
		  saveCart();
		  renderCart();
	  }

	  function renderCart() {
		    const cartItems = document.getElementById("cart-items");
		    const totalEl = document.getElementById("total");

		    cartItems.innerHTML = "";
		    let total = 0;

		    cart.forEach((item, index) => {
			   const subtotal = item.price * item.quantity;
			   total += subtotal;

			   const li = document.createElement("li");
			   li.innerHTML = `
				    <img src="${item.image}" class="item-img">
			
				    <div class="item-info">
					   <span class="item-name">${item.name}</span>
					   <span class="item-price">R$ ${formatPrice(item.price)}</span>
				    </div>

				    <div class="item-controls">
					   <button onclick="decreaseQty(${index})">−</button>
					   <span>${item.quantity}</span>
					   <button onclick="increaseQty(${index})">+</button>
				    </div>

				    <div class="item-subtotal">
					   R$ ${formatPrice(subtotal)}
				    </div>

				    <button class="remove-btn" onclick="removeItem(${index})">✕</button>
			    `;
			    cartItems.appendChild(li);
		    });
		
		  // Mostrar ou esconder botão "Finalizar compra"
		  const checkoutBtn = document.getElementById("checkout-btn");
		  if (cart.length > 0) {
			 checkoutBtn.style.display = "block";
		  } else {
			 checkoutBtn.style.display = "none";
		  }

		  totalEl.innerText = "Total: R$" + formatPrice(total);
	  }
	
	  function goToCheckout() {
		  if (cart.length === 0) {
			 alert("Seu carrinho está vazio");
			 return;
		  }

		  // Redirecionar para a página de checkout
		  window.location.href = "compra.html";
	  }

	  // Carregar ao abrir página
	  renderCart();
  </script>

  <div class="copyright">
    © 2026 AteliWeb - Todos os direitos reservados
  </div>
</body>
</html>
