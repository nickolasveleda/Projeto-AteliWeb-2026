<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Finalizar Compra</title>
	<link rel="stylesheet" href="estilo.css">
</head>
<body>
	<div class="checkout-container">
	<h1>Finalizar Compra</h1>
		<form id="checkout-form" class="checkout-form">
			<div class="form-fields">
				<label for="name">Nome completo</label>
				<input type="text" id="name" name="name" required>

				<label for="email">E-mail</label>
				<input type="email" id="email" name="email" required>

				<label for="phone">Telefone</label>
				<input type="tel" id="phone" name="phone" required>

				<label for="address">Endereço</label>
				<textarea id="address" name="address" rows="3" required></textarea>
			</div>

			<div class="cart-summary">
				<h2>Resumo do pedido</h2>
				<div id="cart-items"></div>
				<div id="total"></div>
			</div>

			<button type="submit" class="btn">Enviar pedido</button>
		</form>
	</div>
	<script>
	    let cart = JSON.parse(localStorage.getItem("cart")) || [];

	    function formatPrice(price){
	        return price.toFixed(2).replace(".", ",");
	    }

	    function renderCart(){
	        const cartItemsDiv = document.getElementById("cart-items");
	        const totalDiv = document.getElementById("total");

	        cartItemsDiv.innerHTML = "";

	        let total = 0;

	        cart.forEach(item => {
	            const subtotal = item.price * item.quantity;

	            total += subtotal;

	            const div = document.createElement("div");

	            div.classList.add("cart-item");

	            div.innerHTML = `
	                <span>${item.name} (${item.quantity}×)</span>
	                <span>R$ ${formatPrice(subtotal)}</span>
	            `;

	            cartItemsDiv.appendChild(div);
	        });

	        totalDiv.innerText = "Total: R$ " + formatPrice(total);
	    }

	    renderCart();

	    document.getElementById("checkout-form").addEventListener("submit", async function(e){
	        e.preventDefault();

	        if(cart.length === 0){
	            alert("Seu carrinho está vazio");
	            return;
	        }

	        // Calcula o total novamente
	        let total = 0;

	        cart.forEach(item => {
	            total += item.price * item.quantity;
	        });

	        const dados = new FormData();

	        const formulario = e.currentTarget;

			dados.append("name", formulario.elements.namedItem("name").value);

			dados.append("email", formulario.elements.namedItem("email").value);

			dados.append("phone", formulario.elements.namedItem("phone").value);

			dados.append("address", formulario.elements.namedItem("address").value);

	        // Envia o carrinho inteiro em JSON
	        dados.append("cart", JSON.stringify(cart));

	        // Envia o valor total
	        dados.append("total", total);


	        try {
	            const resposta = await fetch("salvar_compra.php", {
	                method: "POST",
	                body: dados
	            });

	            const resultado = await resposta.json();

	            if(resultado.sucesso){
	                alert(resultado.mensagem);

	                // Limpa o carrinho somente depois de salvar no banco
	                localStorage.removeItem("cart");

	                window.location.href = "inicio.html";
	            } else {
	                alert("Erro: " + resultado.mensagem);

	            }
	        } catch(erro) {
	            console.error("Erro: ", erro);

	            alert("Verifique sua conexão e tente novamente" + "\nNão foi possível enviar o pedido");
	        }
	    });
	</script>
</body>
</html>
