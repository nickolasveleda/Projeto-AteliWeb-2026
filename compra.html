<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Finalizar Compra</title>
	<link rel="stylesheet" href="estilo.css">
</head>
<body>
	<div class="checkout-container">
	<h1>Finalizar Compra</h1>
		<form id="checkout-form" class="checkout-form">
			<div class="form-fields">
				<label for="name">Nome completo</label>
				<input type="text" id="name" name="name" required>

				<label for="email">E-mail</label>
				<input type="email" id="email" name="email" required>

				<label for="phone">Telefone</label>
				<input type="tel" id="phone" name="phone" required>

				<label for="address">Endereço</label>
				<textarea id="address" name="address" rows="3" required></textarea>
			</div>

			<div class="cart-summary">
				<h2>Resumo do pedido</h2>
				<div id="cart-items"></div>
				<div id="total"></div>
			</div>

			<button type="submit" class="btn">Enviar pedido</button>
		</form>
	</div>
  <script>
    "use strict";

    const STORAGE_KEY = "cart";
    let cart = loadCart();

    function isValidPrice(price) {
      if (typeof price !== "number" && typeof price !== "string") {
        return false;
      }

      if (typeof price === "string") {
        price = price.trim();

        if (!/^\d+(\.\d+)?$/.test(price)) {
          return false;
        }
      }

      const parsedPrice = Number(price);

      return (
        Number.isFinite(parsedPrice) &&
        parsedPrice >= 0
      );
    }
    
    function loadCart() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(STORAGE_KEY)
        );

        if (!Array.isArray(saved)) return [];

        return saved
          .filter(item =>
            item &&
            typeof item.name === "string" &&
            isValidPrice(item.price) &&
            Number.isSafeInteger(Number(item.quantity)) &&
            Number(item.quantity) > 0
          )
          .map(item => ({
            name: item.name,
            price: Number(item.price),
            quantity: Number(item.quantity),
            image: typeof item.image === "string" ? item.image : ""
          }));
      } catch (error) {
        console.error("Erro ao carregar o carrinho: ", error);

        return [];
      }
    }

    function formatPrice(price) {
      return Number(price).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function renderCart() {
      const cartItemsDiv = document.getElementById("cart-items");
      const totalDiv = document.getElementById("total");
      cartItemsDiv.replaceChildren();

      let total = 0;

      cart.forEach(item => {
        const subtotal = item.price * item.quantity;
        total += subtotal;

        const row = document.createElement("div");
        row.className = "cart-item";

        const description = document.createElement("span");
        description.textContent = `${item.name} (${item.quantity}×)`;

        const price = document.createElement("span");
        price.textContent = formatPrice(subtotal);

        row.append(description, price);
        cartItemsDiv.appendChild(row);
      });

      totalDiv.textContent = `Total: ${formatPrice(total)}`;
    }

    renderCart();

    const checkoutForm = document.getElementById("checkout-form");

    if (!checkoutForm) {
      console.error("Formulário de compra não encontrado.");
    } else {
      checkoutForm.addEventListener(
        "submit",
        async function (event) {
          event.preventDefault();

          if (cart.length === 0) {
            alert("Seu carrinho está vazio");
            return;
          }

          const cartIsValid = cart.every(item =>
            item &&
            typeof item.name === "string" &&
            item.name.trim() !== "" &&
            isValidPrice(item.price) &&
            Number.isSafeInteger(item.quantity) &&
            item.quantity > 0
          );

          if (!cartIsValid) {
            alert("O carrinho contém produtos inválidos");
            return;
          }

          const form = event.currentTarget;
          const submitButton = form.querySelector('button[type="submit"]');
          if (submitButton.disabled) return;

          const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
          const dados = new FormData();

          dados.append("name", form.elements.namedItem("name").value.trim());
          dados.append("email", form.elements.namedItem("email").value.trim());
          dados.append("phone", form.elements.namedItem("phone").value.trim());
          dados.append("address", form.elements.namedItem("address").value.trim());

          // O PHP deve recalcular o total usando os preços oficiais do banco de dados
          dados.append("cart", JSON.stringify(cart));
          dados.append("total", total.toFixed(2));

          submitButton.disabled = true;
          const originalText = submitButton.textContent;
          submitButton.textContent = "Enviando pedido...";

          try {
            const resposta = await fetch("salvar_compra.php", {
              method: "POST",
              body: dados
            });

            let resultado;
            try {
              resultado = await resposta.json();
            } catch {
              throw new Error("O servidor retornou uma resposta inválida");
            }

            if (!resposta.ok) {
              throw new Error(resultado?.mensagem || "Não foi possível salvar o pedido");
            }

            if (resultado && resultado.sucesso) {
              alert(resultado.mensagem || "Pedido enviado com sucesso.");
              localStorage.removeItem(STORAGE_KEY);
              window.location.href = "inicio.html";
            } else {
              alert("Erro: " + (resultado?.mensagem || "Não foi possível enviar o pedido"));
            }
          } catch (error) {
            console.error("Erro ao enviar pedido: ", error);
            alert(error.message || "Verifique sua conexão. Não foi possível enviar o pedido");
          } finally {
            submitButton.disabled = false;
            submitButton.textContent = originalText;
          }
        }
      );
    }
  </script>
</body>
</html>
